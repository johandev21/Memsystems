packages:
  - "frontend"
  - "backend"

minimumReleaseAge: 0
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - reselect@5.1.1
  - semver@6.3.1
  - undici-types@6.21.0

allowBuilds:
  esbuild: true
  msw: true
  bufferutil: true
  core-js: true
  utf-8-validate: true
  sharp: true
  unrs-resolver: true


