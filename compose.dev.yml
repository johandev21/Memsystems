name: memsystems-dev

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superuser}
      POSTGRES_DB: ${POSTGRES_DB:-memsystems_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: memsystems-dev-workspace
    build:
      context: .
      target: workspace-dev
    working_dir: /app/backend
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-superuser}@db:5432/${POSTGRES_DB:-memsystems_dev}
      DEV_STORAGE_DIR: /app/dev-storage
    volumes:
      - storage:/app/dev-storage
    command: ["sh", "-c", "pnpm run db:migrate && pnpm run db:seed"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: memsystems-dev-workspace
    build:
      context: .
      target: workspace-dev
    working_dir: /app/backend
    command: ["pnpm", "run", "dev"]
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-superuser}@db:5432/${POSTGRES_DB:-memsystems_dev}
      CLIENT_URL: ${APP_ORIGIN:-http://localhost:3000}
      DEV_STORAGE_DIR: /app/dev-storage
      DEV_STORAGE_PUBLIC_URL: ${APP_ORIGIN:-http://localhost:3000}
      DEV_STORAGE_TOKEN_SECRET: ${DEV_STORAGE_TOKEN_SECRET:-dev-only-storage-token-secret-change-me}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-dev-only-encryption-secret-change-me}
      CRAWLER_PROVIDER: ${CRAWLER_PROVIDER:-firecrawl}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-https://api.firecrawl.dev}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_TIMEOUT_MS: ${FIRECRAWL_TIMEOUT_MS:-30000}
      RETRIEVAL_RELEVANCE_FLOOR: ${RETRIEVAL_RELEVANCE_FLOOR:-0.3}
      RETRIEVAL_RERANK_ENABLED: ${RETRIEVAL_RERANK_ENABLED:-true}
      RETRIEVAL_RERANK_MODEL: ${RETRIEVAL_RERANK_MODEL:-rerank-2.5}
      RETRIEVAL_CANDIDATE_DEPTH: ${RETRIEVAL_CANDIDATE_DEPTH:-32}
      RETRIEVAL_RERANK_THRESHOLD: ${RETRIEVAL_RERANK_THRESHOLD:-0.4}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-8}
      RETRIEVAL_HYBRID_ENABLED: ${RETRIEVAL_HYBRID_ENABLED:-true}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:-60}
      RETRIEVAL_RRF_DENSE_WEIGHT: ${RETRIEVAL_RRF_DENSE_WEIGHT:-1}
      RETRIEVAL_RRF_LEXICAL_WEIGHT: ${RETRIEVAL_RRF_LEXICAL_WEIGHT:-1}
      RETRIEVAL_DENSE_CANDIDATE_DEPTH: ${RETRIEVAL_DENSE_CANDIDATE_DEPTH:-}
      RETRIEVAL_LEXICAL_CANDIDATE_DEPTH: ${RETRIEVAL_LEXICAL_CANDIDATE_DEPTH:-}
      RETRIEVAL_REWRITE_ENABLED: ${RETRIEVAL_REWRITE_ENABLED:-true}
      RETRIEVAL_REWRITE_MODEL: ${RETRIEVAL_REWRITE_MODEL:-openai/gpt-4o-mini}
      RETRIEVAL_REWRITE_TIMEOUT_MS: ${RETRIEVAL_REWRITE_TIMEOUT_MS:-1200}
      RETRIEVAL_REWRITE_MULTI_QUERY: ${RETRIEVAL_REWRITE_MULTI_QUERY:-true}
      RETRIEVAL_REWRITE_VARIANT_COUNT: ${RETRIEVAL_REWRITE_VARIANT_COUNT:-2}
      RETRIEVAL_REWRITE_HYPOTHETICAL_ANSWER: ${RETRIEVAL_REWRITE_HYPOTHETICAL_ANSWER:-false}
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./backend/src:/app/backend/src
      - storage:/app/dev-storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    image: memsystems-dev-workspace
    working_dir: /app/frontend
    command: ["pnpm", "run", "dev"]
    init: true
    restart: unless-stopped
    environment:
      NESTJS_BACKEND_URL: http://backend:4000
      VITE_HOST: 0.0.0.0
      VITE_USE_POLLING: "true"
      VITE_POLLING_INTERVAL: ${VITE_POLLING_INTERVAL:-500}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  pgdata:
  storage:
