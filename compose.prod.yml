name: memsystems-prod

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.docker.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker.prod}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.docker.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: .
      target: backend-prod
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEV_STORAGE_DIR: /app/dev-storage
    volumes:
      - storage:/app/dev-storage
    command: ["sh", "-c", "node dist/database/migrate.js && node dist/database/seed.js"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      target: backend-prod
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CLIENT_URL: ${APP_ORIGIN:?Set APP_ORIGIN in .env.docker.prod}
      DEV_STORAGE_DIR: /app/dev-storage
      DEV_STORAGE_PUBLIC_URL: ${APP_ORIGIN}
      DEV_STORAGE_TOKEN_SECRET: ${DEV_STORAGE_TOKEN_SECRET:?Set DEV_STORAGE_TOKEN_SECRET in .env.docker.prod}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?Set CREDENTIALS_ENCRYPTION_KEY in .env.docker.prod}
      CRAWLER_PROVIDER: ${CRAWLER_PROVIDER:-firecrawl}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-https://api.firecrawl.dev}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_TIMEOUT_MS: ${FIRECRAWL_TIMEOUT_MS:-30000}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-320}
      CHUNK_MIN_TOKENS: ${CHUNK_MIN_TOKENS:-96}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-48}
      EMBEDDING_CONTEXTUAL_ENABLED: ${EMBEDDING_CONTEXTUAL_ENABLED:-true}
      EMBEDDING_CONTEXTUAL_MODEL: ${EMBEDDING_CONTEXTUAL_MODEL:-voyage-context-4}
      RETRIEVAL_RELEVANCE_FLOOR: ${RETRIEVAL_RELEVANCE_FLOOR:-0.3}
      RETRIEVAL_RERANK_ENABLED: ${RETRIEVAL_RERANK_ENABLED:-true}
      RETRIEVAL_RERANK_MODEL: ${RETRIEVAL_RERANK_MODEL:-rerank-2.5}
      RETRIEVAL_CANDIDATE_DEPTH: ${RETRIEVAL_CANDIDATE_DEPTH:-32}
      RETRIEVAL_RERANK_THRESHOLD: ${RETRIEVAL_RERANK_THRESHOLD:-0.4}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-8}
      RETRIEVAL_HYBRID_ENABLED: ${RETRIEVAL_HYBRID_ENABLED:-true}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:-60}
      RETRIEVAL_RRF_DENSE_WEIGHT: ${RETRIEVAL_RRF_DENSE_WEIGHT:-1}
      RETRIEVAL_RRF_LEXICAL_WEIGHT: ${RETRIEVAL_RRF_LEXICAL_WEIGHT:-1}
      RETRIEVAL_DENSE_CANDIDATE_DEPTH: ${RETRIEVAL_DENSE_CANDIDATE_DEPTH:-}
      RETRIEVAL_LEXICAL_CANDIDATE_DEPTH: ${RETRIEVAL_LEXICAL_CANDIDATE_DEPTH:-}
      RETRIEVAL_REWRITE_ENABLED: ${RETRIEVAL_REWRITE_ENABLED:-true}
      RETRIEVAL_REWRITE_MODEL: ${RETRIEVAL_REWRITE_MODEL:-openai/gpt-4o-mini}
      RETRIEVAL_REWRITE_TIMEOUT_MS: ${RETRIEVAL_REWRITE_TIMEOUT_MS:-1200}
      RETRIEVAL_REWRITE_MULTI_QUERY: ${RETRIEVAL_REWRITE_MULTI_QUERY:-true}
      RETRIEVAL_REWRITE_VARIANT_COUNT: ${RETRIEVAL_REWRITE_VARIANT_COUNT:-2}
      RETRIEVAL_REWRITE_HYPOTHETICAL_ANSWER: ${RETRIEVAL_REWRITE_HYPOTHETICAL_ANSWER:-false}
      RETRIEVAL_EVIDENCE_ENABLED: ${RETRIEVAL_EVIDENCE_ENABLED:-true}
      RETRIEVAL_OVERLAP_THRESHOLD: ${RETRIEVAL_OVERLAP_THRESHOLD:-0.8}
      RETRIEVAL_MAX_PER_SOURCE: ${RETRIEVAL_MAX_PER_SOURCE:-4}
      RETRIEVAL_EVIDENCE_TOKEN_BUDGET: ${RETRIEVAL_EVIDENCE_TOKEN_BUDGET:-20000}
      RETRIEVAL_SECTION_EXPANSION: ${RETRIEVAL_SECTION_EXPANSION:-true}
    volumes:
      - storage:/app/dev-storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: .
      target: frontend-prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  storage:
